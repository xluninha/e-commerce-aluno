<!--Este é o esqueleto principal do seu site. É o arquivo HTML único que o navegador carrega primeiro.-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    
    <!-- Título da aba do navegador -->
    <title>ECommerceAluno</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- Ícone pequeno que aparece na aba do navegador (Favicon) -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    
    <!-- Otimiza a conexão para carregar as fontes do Google mais rápido -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Importa a fonte 'Roboto' do Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    
    <!-- Importa a biblioteca de ícones do Google (Material Icons) -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
